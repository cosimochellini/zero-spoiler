name: CI

on:
  push:
    branches: [main]
  # No `edited`: a title or body edit would cancel the run in flight and pay
  # for the whole gate again. The title is checked by pr-title.yml instead.
  # A re-run reuses the old payload, so a body edit that adds a
  # `client-budget:` line takes effect on the next push, on marking the pull
  # request ready, or on a close and reopen.
  #
  # Draft pull requests run nothing: the review loop pushes to a draft many
  # times, and each run cost the whole gate. `ready_for_review` runs it once
  # the draft is done, and every later push runs it again.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # On push the group collapses to a single constant, so releases on main are
  # serialized: a second merge waits for the first one's tag instead of racing
  # it. Pull request runs are keyed per pull request and stay independent.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only pull request runs are disposable. A push to main can be carrying a
  # release, and cancelling that mid-flight would leave a tag without its
  # package.json bump, so those runs, once started, always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: 'true'
  # Silence fallow's background update check so no gate step touches the network.
  FALLOW_UPDATE_CHECK: 'off'
  REACT_DOCTOR_NO_COLOR: '1'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  # No git hooks in CI. lefthook's own installer already skips when CI is set;
  # this also stops the release job's `chore(release)` commit, whose body is the
  # generated notes, from being judged by commitlint.
  LEFTHOOK: '0'

# The gate is five jobs side by side, so a pull request is green after the
# slowest of them rather than after their sum (about 10 minutes in one job).
# GitHub bills no minutes on a public repository, so the extra installs cost
# only a few seconds each. Every job carries the same `if`: it runs on a pull
# request that is not a draft and on pushes to main, where a waiting run is
# cancelled when a newer push queues behind it, so only the newest tip is
# always checked. Main gets the gate again because two pull requests that each
# pass alone can break it together (#1408); without a run there the break
# surfaced only on the next unrelated pull request. A merge queue would stop
# the break instead of reporting it, but GitHub offers it only to organization
# repositories. A draft skips every job, so its run concludes `skipped`
# (scripts/land-pr.sh waits past it); a red job makes the run `failure`, which
# is the one conclusion land-pr.sh reads.
jobs:
  # Everything that needs the sources only: no build, no tests.
  static:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: docs counts gate
        run: npm run gate:docs

      - name: react-doctor gate
        run: npm run gate:react-doctor

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports-static
          path: .gate/
          if-no-files-found: ignore
          retention-days: 7

  # Typed rules build a TypeScript program, so this is the slowest step of the
  # gate. `--concurrency=2` (in the `lint` script) lints files on two worker
  # threads, each with its own program: 147 s to 80 s on a laptop, and no better
  # with 4. `auto` was six times slower there, so the number stays pinned. There
  # is no `--cache`: with typed rules a file's findings can change when another
  # file's types do, and a cache keyed on the file misses it.
  lint:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

  # The suite is split by test file. Each shard writes a blob report and its
  # coverage data; `coverage` merges them. The default reporter stays on so a
  # failing test is readable in this job's log.
  test:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A red shard does not hide the others' failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        shardTotal: [3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Test
        run: >
          npx vitest run --coverage --reporter=default --reporter=blob
          --shard=${{ matrix.shard }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          # A re-run of one failed shard uploads the same name again. Without
          # this the run holds both blobs and `coverage` merges the stale,
          # failed one with the new one.
          overwrite: true
          retention-days: 1

  # The merged run writes the same coverage/coverage-final.json `npm test` did,
  # which fallow reads for its per-function CRAP score.
  coverage:
    needs: test
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: fallow's health pass reads the git log for churn
          # hotspots.
          fetch-depth: 0

      - name: Set up
        uses: ./.github/actions/setup

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest/blob/

      - name: Merge coverage
        run: npx vitest --merge-reports --coverage

      - name: fallow gate
        run: npm run gate:fallow

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports-coverage
          path: .gate/
          if-no-files-found: ignore
          retention-days: 7

  # Everything that reads the build.
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Holds the design gate's retry: see detectWithRetry in
    # scripts/design-gate.rules.mjs before lowering it.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The client growth budget builds the PR's base commit in a worktree.
          fetch-depth: 0

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      # Serves the build, so it has to follow it. The detector drives the
      # Chrome the runner image ships: it looks for `google-chrome` on PATH
      # and in /opt/google/chrome, or takes IMPECCABLE_BROWSER.
      - name: design gate
        run: npm run gate:design

      # Reads the built client chunks, so it has to follow the build.
      - name: archive gate
        run: npm run gate:archive

      # The client growth budget, in the next three steps, runs on pull
      # requests only. It compares a pull request with its base and reads the
      # `client-budget:` line from its body; on main there is neither, and the
      # merged pull request already passed it.
      #
      # The base build is a pure function of the base commit, so it is cached
      # by SHA: later pushes to the same PR skip a second `npm ci` and build.
      - name: Restore PR base build
        if: github.event_name == 'pull_request'
        id: base-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/client-base
          key: client-base-${{ github.event.pull_request.base.sha }}

      # A separate worktree leaves the head build intact. Use the event's exact
      # base commit, not today's main, and install its own pinned dependencies.
      - name: Build PR base
        if:
          github.event_name == 'pull_request' &&
          steps.base-cache.outputs.cache-hit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/client-budget-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/client-budget-base"
          npm ci
          npm run build
          cp -r dist/client "$RUNNER_TEMP/client-base"

      - name: Client growth budget
        if: github.event_name == 'pull_request'
        env:
          # PR prose is data, never interpolated into the shell script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run:
          node scripts/client-budget.mjs "$RUNNER_TEMP/client-base" dist/client

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports-build
          path: .gate/
          if-no-files-found: ignore
          retention-days: 7

  # A red gate on main opens a p0 issue, or comments on the one already open,
  # so the next agent loop picks the fix first. GitHub runs no check on a merge
  # of two green pull requests together, so this is how a break they make
  # between them is found. The title is fixed: it is what finds the open issue.
  # Nothing closes it when main turns green again; the pull request that fixes
  # main does, with `Closes #N`.
  #
  # Not `failure()`: a gate job that runs past its `timeout-minutes` ends
  # `cancelled`, and that is a red main too. `!cancelled()` still keeps a
  # cancel of the whole run by hand from opening an issue.
  alert:
    needs: [static, lint, test, coverage, build]
    if:
      ${{ !cancelled() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result,
      'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    permissions:
      issues: write

    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # pipefail: a failed `gh issue list` must fail the step, not read as
        # "no issue open" and open a second p0.
        run: |
          set -o pipefail
          title='CI is red on main'
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          RUN="$repo/actions/runs/$GITHUB_RUN_ID"
          COMMIT="$repo/commit/$GITHUB_SHA"
          report="The gate failed on $COMMIT: $RUN"
          number=$(gh issue list --state open --label area:ci \
            --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$report"
            exit
          fi
          gh issue create --title "$title" \
            --label type:bug,area:ci,status:ready,priority:p0,size:s,scope:infrastructure \
            --body "## What
          $report

          Open the run, find the red job and fix main in a pull request that closes this issue.

          ## Why
          Two pull requests that each pass alone can break main together, and every pull request opened after that inherits the failure (#1408).

          ## How to verify
          - The CI run on the push that merges the fix is green on main.
          - \`npm run check\` passes on main."

  # Cuts the release for every push to main, which in practice means every
  # squashed pull request. It does not wait for the gate, which runs beside it
  # on the same push: a merge of two green PRs that break each other still
  # tags, and the alert job above reports the break. The site deploys from
  # Workers Builds on every push either way.
  #
  # This job is also why `main` carries no branch protection. A ruleset that
  # requires a pull request would reject the `chore(release)` commit pushed
  # below as well, and adding `github-actions` to the bypass list is rejected
  # on a personal repository. Protecting the branch costs either a deploy key
  # held as a secret or dropping the package.json version bump.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write # push the version commit, create the tag
      issues: write # comment on issues closed by the release
      pull-requests: write # comment on the released pull requests

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # semantic-release walks the full history and every tag to work out
          # the previous version.
          fetch-depth: 0
          # @semantic-release/git pushes the version commit back with these
          # credentials.
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Recovering a half-finished release: if this step dies between tagging
      # and publishing, the tag and the version commit land but the GitHub
      # Release does not, and the next merge will not backfill it because its
      # commits are already released. Create it by hand:
      #   gh release create vX.Y.Z --generate-notes
      #
      # Installed through npx rather than devDependencies: this pulls ~250
      # packages that no other job, and no local `npm install`, has any use
      # for. Versions are pinned, so the run stays reproducible.
      #
      # commit-analyzer, release-notes-generator, npm and github ship inside
      # semantic-release itself. The `conventionalcommits` preset does not
      # (commit-analyzer only depends on conventional-changelog-angular), and
      # neither does the git plugin, so both are listed.
      #
      # The preset is held at 9.x on purpose. 10.x requires
      # conventional-changelog-writer@9, while release-notes-generator@14
      # still depends on ^8, and the mismatch only surfaces at release time as
      # `Missing helper: "conventional-changelog-conventionalcommits requires
      # conventional-changelog-writer@9 or newer"`. Raise it once
      # release-notes-generator ships a writer@9 dependency.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@9.3.1 \
            semantic-release
