name: PR title

# The pull request title is the only input to the version bump: GitHub
# squashes the branch into one commit on main whose subject is that title,
# and semantic-release reads it to pick patch / minor / major. Kept apart from
# CI so a title edit re-runs only this check, not the whole gate. This job runs
# without `npm ci` because the validator has no dependencies.
#
# No `synchronize`: a push never changes the title. Drafts and body-only edits
# skip the job, so the title is checked when the pull request is marked ready
# and on every title edit after that, before the squash merge reads it.
on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    if:
      ${{ !github.event.pull_request.draft && (github.event.action != 'edited'
      || github.event.changes.title) }}
    # On the job, not the workflow: a skipped run, such as a body edit, must
    # not cancel a title check in flight.
    concurrency:
      group: pr-title-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The title goes through `env`, never through `${{ }}` inside the shell
      # script: a PR title is attacker-controlled and would be interpolated
      # before the shell ever sees it as data.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-title.mjs
